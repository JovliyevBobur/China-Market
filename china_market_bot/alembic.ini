# ==========================================
# Alembic Configuration
# ==========================================

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path
prepend_sys_path = .

# Timezone to use for timestamps
timezone = UTC

# Truncate long revision identifiers
truncate_slug_length = 40

# Set to 'true' to run migration in offline mode
# This run the migration without connecting to the database
revision_environment = false

# Set to 'true' to require --rev-id argument to generate revisions
# requires_revision = true

# Post write hooks
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
