# ==========================================
# 🐳 China Market Bot - Docker Compose
# Development Configuration
# ==========================================

version: '3.8'

services:
  # ==========================================
  # Bot Service
  # ==========================================
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: china_market_bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_network
    volumes:
      - ../logs:/app/logs
      - ../media:/app/media
      - ..:/app:ro  # Mount code for development

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: china_market_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-china_market}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-china_market}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network
    ports:
      - "5432:5432"

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: china_market_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network
    ports:
      - "6379:6379"

  # ==========================================
  # pgAdmin (optional, for development)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: china_market_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - bot_network
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - dev

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    name: china_market_postgres_data
  redis_data:
    name: china_market_redis_data
  pgadmin_data:
    name: china_market_pgadmin_data

# ==========================================
# Networks
# ==========================================
networks:
  bot_network:
    name: china_market_network
    driver: bridge
